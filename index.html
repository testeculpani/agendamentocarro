<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Reserva de Carros – Triton / Strada</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --line:#e5e7eb;
  --shadow:0 8px 20px rgba(0,0,0,.08);

  --primary:#2563eb;        /* azul escuro reserva */
  --primary-soft:#93c5fd;   /* intervalo */
  --primary-edge:#1e40af;   /* início/fim */
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}

.wrap{
  max-width:100%;
  padding:12px;
}

.card{
  background:var(--card);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:14px;
  margin-bottom:14px;
}

h1{
  font-size:18px;
  margin:0;
}
.sub{
  font-size:13px;
  color:var(--muted);
  margin-top:4px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  padding:10px 14px;
  border-radius:12px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}
.btn.primary{
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}

.calendar-card{padding:12px}

.calHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
  gap:10px;
}

.monthLabel{
  font-weight:700;
  font-size:15px;
  text-transform:capitalize;
}

.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.dow{
  text-align:center;
  font-size:11px;
  color:var(--muted);
}

.day{
  min-height:56px;
  border-radius:12px;
  background:#f1f5f9;
  text-align:center;
  padding-top:6px;
  cursor:pointer;
  position:relative;
  font-weight:600;
  user-select:none;
}

.day.muted{
  opacity:.35;
  cursor:default;
}

.day.reserved{
  background:var(--primary);
  color:#fff;
}

.day.range{
  background:var(--primary-soft);
  color:#000;
}

.day.edge{
  background:var(--primary-edge);
  color:#fff;
}

.num{
  font-size:14px;
}

.todayDot{
  position:absolute;
  top:6px;
  right:6px;
  width:6px;
  height:6px;
  background:#16a34a;
  border-radius:50%;
}

.form{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

label{
  font-size:13px;
  color:var(--muted);
  display:flex;
  flex-direction:column;
  gap:4px;
}

input,select{
  padding:12px;
  font-size:15px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#fff;
}

.list{
  margin-top:12px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.item{
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  font-size:14px;
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:flex-start;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.mini{
  padding:8px 10px;
  border-radius:10px;
  border:1px solid #fecaca;
  background:#fff5f5;
  color:#dc2626;
  font-size:13px;
  cursor:pointer;
  font-weight:700;
}

/* Desktop */
@media (min-width:768px){
  .wrap{max-width:1000px;margin:auto}
  .grid{
    display:grid;
    grid-template-columns:1.2fr .8fr;
    gap:14px;
  }
}
</style>
</head>

<body>
<div class="wrap">
  <div class="card top">
    <div>
      <h1>Reserva de Carros</h1>
      <div class="sub">Selecione o período no calendário</div>
    </div>
  </div>

  <div class="grid">
    <div class="card calendar-card">
      <div class="calHead">
        <button class="btn" id="prevBtn" type="button">◀</button>
        <div class="monthLabel" id="monthLabel"></div>
        <button class="btn" id="nextBtn" type="button">▶</button>
      </div>

      <div class="cal-grid" id="dow"></div>
      <div class="cal-grid" id="cal"></div>
    </div>

    <div class="card">
      <div class="sub" id="selLabel">Selecione um período</div>

      <form id="form" class="form">
        <label>Carro
          <select id="car">
            <option>Triton</option>
            <option>Strada</option>
          </select>
        </label>

        <label>Quem vai usar
          <input id="who" placeholder="Nome"/>
        </label>

        <label>Data inicial
          <input id="startDate" readonly/>
        </label>

        <label>Data final
          <input id="endDate" readonly/>
        </label>

        <button class="btn primary" type="submit">Salvar reserva</button>
      </form>

      <div class="list" id="list"></div>
    </div>
  </div>
</div>

<script>
(() => {
  const LS="reserva_carros_mobile";

  const dowEl=document.getElementById("dow");
  const calEl=document.getElementById("cal");
  const monthLabel=document.getElementById("monthLabel");
  const selLabel=document.getElementById("selLabel");
  const listEl=document.getElementById("list");
  const startInp=document.getElementById("startDate");
  const endInp=document.getElementById("endDate");

  const prevBtn=document.getElementById("prevBtn");
  const nextBtn=document.getElementById("nextBtn");

  let view=new Date();
  view = new Date(view.getFullYear(), view.getMonth(), 1); // sempre no 1º dia do mês
  let selStart=null, selEnd=null;

  const pad=n=>String(n).padStart(2,"0");
  const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const br=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
  const parse=s=>{const [Y,M,D]=s.split("-").map(Number); return new Date(Y, M-1, D);};

  const load=()=>JSON.parse(localStorage.getItem(LS)||"[]");
  const save=d=>localStorage.setItem(LS,JSON.stringify(d));

  function renderDOW(){
    dowEl.innerHTML = "";
    ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].forEach(d=>{
      const el=document.createElement("div");
      el.className="dow"; el.innerText=d; dowEl.appendChild(el);
    });
  }

  function renderCalendar(){
    calEl.innerHTML="";
    monthLabel.innerText=view.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
    const y=view.getFullYear(), m=view.getMonth();
    const firstDow=new Date(y,m,1).getDay();
    const days=new Date(y,m+1,0).getDate();
    const data=load();

    // blanks
    for(let i=0;i<firstDow;i++){
      const d=document.createElement("div");
      d.className="day muted";
      calEl.appendChild(d);
    }

    for(let i=1;i<=days;i++){
      const d=new Date(y,m,i);
      const key=ymd(d);
      const div=document.createElement("div");
      div.className="day";
      div.innerHTML=`<div class="num">${i}</div>`;

      // bolinha "hoje"
      const today = new Date();
      if(d.getFullYear()===today.getFullYear() && d.getMonth()===today.getMonth() && d.getDate()===today.getDate()){
        const dot = document.createElement("span");
        dot.className="todayDot";
        div.appendChild(dot);
      }

      // reservado (qualquer carro)
      if(data.some(r=>key>=r.start && key<=r.end)) div.classList.add("reserved");

      // seleção por intervalo
      if(selStart && selEnd && key>selStart && key<selEnd) div.classList.add("range");
      if(key===selStart || key===selEnd) div.classList.add("edge");

      div.onclick=()=>pick(key);
      calEl.appendChild(div);
    }
  }

  function pick(key){
    if(!selStart || selEnd){
      selStart=key; selEnd=null;
    } else if(key < selStart){
      selEnd=selStart; selStart=key;
    } else {
      selEnd=key;
    }

    startInp.value = selStart || "";
    endInp.value = selEnd || "";

    if(selStart && selEnd){
      selLabel.innerText = `Período: ${br(parse(selStart))} até ${br(parse(selEnd))}`;
    } else if(selStart){
      selLabel.innerText = `Início: ${br(parse(selStart))} (clique no fim)`;
    } else {
      selLabel.innerText = "Selecione um período";
    }

    renderCalendar();
    renderList();
  }

  function renderList(){
    listEl.innerHTML="";
    const data = load().slice().sort((a,b)=> (a.start.localeCompare(b.start)));

    if(!data.length){
      listEl.innerHTML = `<div class="small">Nenhuma reserva ainda.</div>`;
      return;
    }

    data.forEach(r=>{
      const div=document.createElement("div");
      div.className="item";
      div.innerHTML=`<div>
        <strong>${escapeHtml(r.car)}</strong><br>
        <span class="small">${escapeHtml(r.who || "")}</span><br>
        <span class="small">${r.start} até ${r.end}</span>
      </div>
      <button class="mini" type="button" data-del="${r.id}">Excluir</button>`;
      listEl.appendChild(div);
    });

    listEl.querySelectorAll("[data-del]").forEach(btn=>{
      btn.addEventListener("click", () => del(btn.getAttribute("data-del")));
    });
  }

  function escapeHtml(s){
    return (s ?? "").toString()
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function rangesOverlap(aStart,aEnd,bStart,bEnd){
    return aStart <= bEnd && bStart <= aEnd; // inclusivo
  }

  function del(id){
    const all = load();
    const it = all.find(x=> String(x.id)===String(id));
    if(!it) return;
    if(!confirm(`Excluir reserva?
${it.car} - ${it.who}
${it.start} até ${it.end}`)) return;
    save(all.filter(r=> String(r.id)!==String(id)));
    renderCalendar();
    renderList();
  }

  // Fix: Prev/Next month buttons
  prevBtn.addEventListener("click", () => {
    view = new Date(view.getFullYear(), view.getMonth()-1, 1);
    renderCalendar();
  });
  nextBtn.addEventListener("click", () => {
    view = new Date(view.getFullYear(), view.getMonth()+1, 1);
    renderCalendar();
  });

  document.getElementById("form").addEventListener("submit", (e)=>{
    e.preventDefault();

    if(!selStart || !selEnd) return alert("Selecione o período (início e fim).");
    const whoV = document.getElementById("who").value.trim();
    if(!whoV) return alert("Informe quem vai usar.");

    const carV = document.getElementById("car").value;
    const data = load();

    // conflito por carro (sobreposição de datas)
    const conflict = data.some(r => r.car===carV && rangesOverlap(r.start, r.end, selStart, selEnd));
    if(conflict) return alert(`Conflito: ${carV} já está reservado nesse período.`);

    data.push({id: Date.now(), car: carV, who: whoV, start: selStart, end: selEnd});
    save(data);

    // reset selection
    selStart = null; selEnd = null;
    document.getElementById("who").value="";
    startInp.value = ""; endInp.value = "";
    selLabel.innerText = "Selecione um período";

    renderCalendar();
    renderList();
  });

  // Init
  renderDOW();
  renderCalendar();
  renderList();
})();
</script>
</body>
</html>
