<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Agendamento de Carros – Triton / Strada</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f8;
  margin:0;
  padding:20px;
}
.container{
  max-width:900px;
  margin:auto;
  background:#fff;
  padding:20px;
  border-radius:10px;
}
h1{text-align:center;margin-top:0}
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
  margin-bottom:20px;
}
.day{
  padding:12px 0;
  text-align:center;
  border-radius:6px;
  background:#e9ecef;
  cursor:pointer;
  font-weight:600;
}
.day:hover{background:#dbe1e6}
.day.selected{background:#0d6efd;color:#fff}
.day.in-range{background:#9ec5fe;color:#000}
.day.reserved{background:#0d6efd;color:#fff}
.form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.form input,.form select,.form button{
  padding:8px;
  font-size:14px;
}
.form button{
  grid-column:1/3;
  background:#0d6efd;
  color:#fff;
  border:none;
  cursor:pointer;
}
.form button:hover{background:#0b5ed7}
.list{margin-top:20px}
.item{
  border-bottom:1px solid #ddd;
  padding:6px 0;
  font-size:14px;
}
.small{font-size:12px;color:#666}
</style>
</head>

<body>
<div class="container">
<h1>Agendamento de Carros</h1>

<div id="calendar" class="calendar"></div>

<div class="form">
  <select id="car">
    <option value="Triton">Triton</option>
    <option value="Strada">Strada</option>
  </select>
  <input id="user" placeholder="Quem vai usar">
  <button onclick="save()">Salvar Reserva</button>
</div>

<div class="list">
  <h3>Reservas do mês</h3>
  <div id="list"></div>
</div>
</div>

<script>
const STORAGE = "agenda_carros_range";
let startDate = null;
let endDate = null;
let viewDate = new Date();

function load(){ return JSON.parse(localStorage.getItem(STORAGE) || "[]"); }
function saveStorage(d){ localStorage.setItem(STORAGE, JSON.stringify(d)); }

function dateKey(d){
  return d.toISOString().split("T")[0];
}

function renderCalendar(){
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";
  const y = viewDate.getFullYear();
  const m = viewDate.getMonth();
  const days = new Date(y, m+1, 0).getDate();
  const data = load();

  for(let d=1; d<=days; d++){
    const date = new Date(y,m,d);
    const key = dateKey(date);
    const div = document.createElement("div");
    div.className = "day";
    div.textContent = d;

    // reservado
    if(data.some(r => key >= r.start && key <= r.end)){
      div.classList.add("reserved");
    }

    // seleção
    if(startDate && dateKey(date) === startDate) div.classList.add("selected");
    if(startDate && endDate && key > startDate && key < endDate) div.classList.add("in-range");
    if(endDate && dateKey(date) === endDate) div.classList.add("selected");

    div.onclick = ()=>{
      if(!startDate || (startDate && endDate)){
        startDate = dateKey(date);
        endDate = null;
      }else{
        if(dateKey(date) < startDate){
          endDate = startDate;
          startDate = dateKey(date);
        }else{
          endDate = dateKey(date);
        }
      }
      renderCalendar();
    };
    cal.appendChild(div);
  }
  renderList();
}

function save(){
  if(!startDate || !endDate){
    alert("Selecione um período no calendário");
    return;
  }
  const user = document.getElementById("user").value;
  if(!user){
    alert("Informe quem vai usar");
    return;
  }
  const data = load();
  data.push({
    car: document.getElementById("car").value,
    user,
    start: startDate,
    end: endDate
  });
  saveStorage(data);
  startDate = null;
  endDate = null;
  document.getElementById("user").value="";
  renderCalendar();
}

function renderList(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  const data = load();
  if(data.length===0){
    list.innerHTML = "<div class='small'>Nenhuma reserva</div>";
    return;
  }
  data.forEach(r=>{
    const div = document.createElement("div");
    div.className="item";
    div.innerHTML = `<strong>${r.car}</strong> - ${r.user}<br>
    <span class="small">${r.start} até ${r.end}</span>`;
    list.appendChild(div);
  });
}

renderCalendar();
</script>
</body>
</html>
